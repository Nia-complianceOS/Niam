# Render blueprint for the Niam backend.
#
# Docker, not a Python runtime: the image installs intelligence/ as a
# package from the repository root, and Render's native Python
# environment would only build backend/. dockerContext must stay "." for
# the same reason -- the whole point of the root Dockerfile is that
# intelligence/ is inside the build context.
#
# Only the backend is here. The frontend is a static Vite build and goes
# on Vercel (see vercel.json), because Render's static hosting would mean
# managing two services on one free plan that sleeps.
#
# sync: false means "ask me for this value in the dashboard, and never
# store it in the repository". Every secret is marked that way. Nothing
# in this file is a credential.

services:
  - type: web
    name: niam-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore          # closest to an Aura instance in ap-south-1
    branch: main
    healthCheckPath: /api/v1/health
    autoDeploy: true

    envVars:
      # --- runtime ---------------------------------------------------
      - key: APP_ENV
        value: production
      # Comma-separated. Set this to the Vercel URL after the frontend's
      # first deploy -- including https://, with no trailing slash. A
      # mismatch here is the classic first-deploy failure: the API answers
      # perfectly in a browser tab and every request from the app is
      # blocked before it is sent.
      - key: CORS_ORIGINS
        sync: false

      # --- databases -------------------------------------------------
      # Two of them. Neo4j holds the compliance graph -- systems, data
      # types, vendors, clauses, gaps. Supabase (Postgres) holds identity
      # and everything relational: users, GitHub connections, OAuth
      # states, scan history, the audit log.
      #
      # Without the Supabase pair the service boots and then fails on the
      # first request that touches a user, which is login -- so the whole
      # app is unusable while /api/v1/health still answers.
      - key: SUPABASE_URL
        sync: false
      # The service-role key. It bypasses Postgres row-level security by
      # design, which is why it lives only here and never reaches the
      # browser; the per-account boundary is the backend's own user_id
      # filtering (see backend/tests/test_tenancy_scoping.py).
      - key: SUPABASE_SECRET_KEY
        sync: false

      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false

      # --- providers -------------------------------------------------
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false

      # --- auth ------------------------------------------------------
      # Generate a fresh one for production; do not reuse the local value.
      - key: JWT_SECRET
        generateValue: true

      # --- the two guards that keep a public URL from being a PR bot --
      # Both stay fail-closed. GITHUB_DRY_RUN=true means the app logs
      # what it would push and pushes nothing. Turn it off only once
      # PR_ALLOWED_REPOS names the repositories you accept writes to --
      # an empty allow-list denies everything.
      - key: GITHUB_DRY_RUN
        value: "true"
      - key: PR_ALLOWED_REPOS
        sync: false

      # --- scan limits -----------------------------------------------
      # Every scan reads a repository and calls Gemini on each candidate
      # line. These are the ceilings on a shared quota.
      - key: SCAN_RATE_LIMIT_PER_HOUR
        value: "10"
      - key: SCAN_MAX_CONCURRENT
        value: "2"

      # --- per-user GitHub connection --------------------------------
      # Each user connects their own GitHub account; the deployment no
      # longer holds one token that acts for everybody. Register an OAuth
      # App at github.com/settings/developers with the callback
      #   https://niam-api.onrender.com/api/v1/github/oauth/callback
      # An OAuth App takes exactly one callback URL, so local development
      # needs its own app with the localhost callback.
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

      # Which of the OAuth App's registered redirect URIs this deployment
      # uses. GitHub allows up to ten per app, so one app serves both
      # local development and this one -- but with more than one
      # registered, GitHub will not choose per-environment, so it is sent
      # explicitly. Must match a registered URI exactly:
      #   https://niam-api.onrender.com/api/v1/github/oauth/callback
      - key: GITHUB_OAUTH_REDIRECT_URI
        sync: false

      # Fernet key encrypting each user's stored GitHub token at rest.
      # Generate with:
      #   python -c "from cryptography.fernet import Fernet; \
      #              print(Fernet.generate_key().decode())"
      # Outside development the app REFUSES to store a token without
      # this, rather than keeping one in plaintext. Rotating it
      # invalidates stored connections -- users are asked to reconnect,
      # which is the correct failure.
      - key: TOKEN_ENCRYPTION_KEY
        sync: false

      # Where the OAuth callback sends the browser once GitHub answers.
      # The Vercel origin, same value as CORS_ORIGINS. Left at its
      # localhost default, every user who connects GitHub in production
      # is redirected to their own machine.
      - key: FRONTEND_URL
        sync: false

      # --- webhook ---------------------------------------------------
      # Required outside development: without it the webhook route
      # refuses every delivery rather than trusting an unsigned one.
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
