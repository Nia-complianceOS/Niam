server {
    listen 80;
    
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Catch-all for React Router
        try_files $uri $uri/ /index.html;
    }

    # Optional: proxy /api to the backend if CORS is completely disabled.
    # We will rely on direct browser-to-backend calls for now.
}
