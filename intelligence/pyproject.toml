[project]
name = "niam-intelligence"
version = "0.1.0"
requires-python = ">=3.11"
# The CLIs resolve --owner against the accounts table, which lives in
# Postgres via Supabase (graph/owner.py), and every module loads
# backend/.env through graph/env.py. Declared here so that
# `pip install -e ./intelligence` is sufficient on its own -- the CLIs
# should not depend on someone having installed the backend first.
dependencies = [
    "supabase>=2.31.0",
    "python-dotenv>=1.0.0",
]
[tool.setuptools.packages.find]
where = ["."]
include = ["graph*", "ingestion*", "legal*", "retrieval*", "reconciliation*", "reasoning*"]
